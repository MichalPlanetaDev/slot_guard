services:
  - type: web
    name: slotguard-michalplanetadev
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /up
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: APP_HOST
        value: slotguard-michalplanetadev.onrender.com
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_EMAIL
        value: demo@slotguard.app
      - key: DEMO_PASSWORD
        value: SlotGuard-demo-2026!
      - key: MAIL_FROM
        value: SlotGuard Demo <no-reply@slotguard.invalid>
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: JOB_CONCURRENCY
        value: "1"
      - key: RAILS_LOG_LEVEL
        value: info
